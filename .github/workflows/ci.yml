name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token; nothing in this workflow writes to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: owner
          POSTGRES_PASSWORD: ci-owner-password
          POSTGRES_DB: cms_prototype
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U owner -d cms_prototype"
          --health-interval 2s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      # Throwaway credentials for the CI service container only.
      MIGRATION_DATABASE_URL: postgres://owner:ci-owner-password@localhost:5432/cms_prototype
      CMS_DB_PASSWORD: ci-cms-password
      SITE_DB_PASSWORD: ci-site-password
      # Redis integration tests flush this database; end-to-end tests use database 1.
      REDIS_TEST_URL: redis://localhost:6379/14
    steps:
      # Third-party actions are pinned to full commit SHAs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm db:setup
      - run: pnpm test:unit
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
